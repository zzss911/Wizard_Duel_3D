<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wizard Duel 3D · 魔法决斗</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- HUD：由 HUD.js 驱动 -->
  <div id="hud">
    <div class="hp-bar hp-player">
      <div class="hp-label">玩家</div>
      <div class="hp-track"><div class="hp-fill" id="hp-player-fill"></div></div>
    </div>
    <div class="hp-bar hp-target">
      <div class="hp-label">敌方法师</div>
      <div class="hp-track"><div class="hp-fill enemy" id="hp-enemy-fill"></div></div>
      <div class="hp-label sub">训练靶</div>
      <div class="hp-track slim"><div class="hp-fill dummy" id="hp-target-fill"></div></div>
    </div>
    <div id="crosshair"></div>
    <div id="damage-layer"></div>
    <div id="banner"></div>
    <div id="hit-vignette"></div>
    <div id="screen-flash"></div>
    <div id="end-panel">
      <div id="end-text"></div>
      <div id="end-meta"></div>
      <div class="end-actions">
        <button id="btn-restart">再来一局</button>
        <button id="btn-next-difficulty">挑战更高难度</button>
        <button id="btn-main-menu">返回主菜单</button>
      </div>
    </div>
    <div id="hint-desktop">WASD 移动 · 点击画面锁定鼠标转镜头 · 左键 / J 发射魔法弹<br>Space 闪避 · Q 爆裂咒 · E 束缚咒</div>
    <div id="rotate-tip">建议横屏游玩，体验更佳</div>

    <!-- 技能按钮（触屏显示，桌面端可点击） -->
    <div id="btn-dodge" class="skill-btn">
      <span class="skill-label">闪避</span>
      <div class="skill-cd"></div>
    </div>
    <div id="btn-skill1" class="skill-btn">
      <span class="skill-label">爆裂</span>
      <div class="skill-cd"></div>
    </div>
    <div id="btn-skill2" class="skill-btn">
      <span class="skill-label">束缚</span>
      <div class="skill-cd"></div>
    </div>
  </div>

  <!-- 开始界面 -->
  <div id="start-panel">
    <div class="start-card">
      <h1>WIZARD DUEL 3D</h1>
      <h2>魔法决斗</h2>
      <div class="control-guide" id="control-guide-desktop">
        <p>WASD：移动</p>
        <p>鼠标：观察 / 瞄准</p>
        <p>左键 / J：普通魔法</p>
        <p>Space：闪避</p>
        <p>Q：爆裂咒</p>
        <p>E：束缚咒</p>
      </div>
      <div class="control-guide" id="control-guide-mobile" style="display:none">
        <p>左侧拖动：移动</p>
        <p>右侧滑动：观察</p>
        <p>攻击按钮：普通魔法</p>
        <p>闪避按钮：快速躲避</p>
      </div>
      <div class="difficulty-select">
        <button data-difficulty="rookie" class="selected">新手</button>
        <button data-difficulty="normal">普通</button>
        <button data-difficulty="hard">高手</button>
      </div>
      <button id="btn-start-duel">开始决斗</button>
      <button id="btn-retry-tutorial" style="display:none">重新训练</button>
    </div>
  </div>

  <!-- 倒计时 HUD -->
  <div id="duel-countdown"></div>

  <!-- 新手训练覆盖层 -->
  <div id="tutorial-overlay">
    <div id="tutorial-text"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
